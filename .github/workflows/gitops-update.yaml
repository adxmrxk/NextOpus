name: GitOps Update

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  update-manifests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get SHA
        id: sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags for services that were actually rebuilt
        run: |
          # CI only builds services whose paths changed, so rewriting every tag
          # to this SHA points the untouched services at images that were never
          # published. Only update a tag that exists in the registry.
          SHA="${{ steps.sha.outputs.sha }}"
          OWNER="${{ github.repository_owner }}"
          for svc in data-generator data-processor guardian; do
            image="ghcr.io/${OWNER}/${svc}:${SHA}"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "updating ${svc} -> ${SHA}"
              sed -i "s|image: ghcr.io/.*/${svc}:.*|image: ${image}|g" "kubernetes/apps/${svc}/deployment.yaml"
            else
              echo "skipping ${svc}: ${image} was not published for this commit"
            fi
          done

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add kubernetes/
          git diff --staged --quiet || git commit -m "chore: update image tags to ${{ steps.sha.outputs.sha }}"
          git push
