---
# Kyverno Policy Engine Installation
# Enforces security policies automatically
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    app.kubernetes.io/name: kyverno
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kyverno
  namespace: kube-system
spec:
  repo: https://kyverno.github.io/kyverno
  chart: kyverno
  version: "3.1.4"
  targetNamespace: kyverno
  valuesContent: |-
    replicaCount: 1

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

    backgroundController:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi

    cleanupController:
      enabled: true
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 25m
          memory: 64Mi

    reportsController:
      enabled: true
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi

    admissionController:
      replicas: 1
---
# Image provenance. Refuses to run a NextOpus image unless it carries a cosign
# signature produced by this repository's CI workflow.
#
# Keyless verification: no public key to distribute or rotate. The signature is
# checked against the Rekor transparency log and the identity is pinned to the
# exact workflow and branch allowed to publish, so a signature from any other
# workflow, repo or fork does not satisfy it.
#
# Audit for now so it reports without blocking. Flip to Enforce once a signed
# build has rolled out, after which an unsigned or tampered image is rejected
# at admission.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/description: NextOpus images must be signed by this repo's CI
spec:
  validationFailureAction: Audit
  background: false          # verifyImages cannot run in background scans
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-nextopus-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nextopus
                - nextopus-system
      verifyImages:
        - imageReferences:
            - "ghcr.io/adxmrxk/data-generator:*"
            - "ghcr.io/adxmrxk/data-processor:*"
            - "ghcr.io/adxmrxk/guardian:*"
          mutateDigest: true       # pin the tag to the digest that was verified
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/adxmrxk/NextOpus/.github/workflows/ci.yaml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
---
# NextOpus Security Policies
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-labels
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require Labels
    policies.kyverno.io/description: Require app and version labels on all pods
spec:
  validationFailureAction: Audit  # Change to Enforce in production
  background: true
  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nextopus
      validate:
        message: "The label 'app' is required."
        pattern:
          metadata:
            labels:
              app: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/description: Disallow running containers in privileged mode
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: deny-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - metallb-system
                - istio-system
                - kyverno
                - ingress-nginx
      validate:
        message: "Privileged containers are not allowed."
        pattern:
          spec:
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/description: Require containers to run as non-root user
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nextopus
      validate:
        message: "Containers must run as non-root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/description: Require CPU and memory limits on all containers
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nextopus
      validate:
        message: "CPU and memory limits are required."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Require Health Probes
    policies.kyverno.io/description: Require liveness and readiness probes
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-probes
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nextopus
      validate:
        message: "Liveness and readiness probes are required."
        pattern:
          spec:
            containers:
              - livenessProbe:
                  httpGet:
                    path: "?*"
                    port: "?*"
                readinessProbe:
                  httpGet:
                    path: "?*"
                    port: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-default-securitycontext
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/title: Add Default Security Context
    policies.kyverno.io/description: Mutate pods to add security context if missing
spec:
  rules:
    - name: add-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - nextopus
      mutate:
        patchStrategicMerge:
          spec:
            securityContext:
              +(runAsNonRoot): true
              +(fsGroup): 1000
            containers:
              - (name): "*"
                securityContext:
                  +(allowPrivilegeEscalation): false
                  +(readOnlyRootFilesystem): true
                  +(capabilities):
                    +(drop):
                      - ALL
