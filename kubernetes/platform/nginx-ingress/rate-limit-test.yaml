---
# Rate Limit Testing Job
# Demonstrates rate limiting by sending burst traffic
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: rate-limit-test
  namespace: nextopus
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      # The add-default-securitycontext policy injects runAsNonRoot, and busybox
      # runs as root by default, so without this the job never starts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: load-test
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              INGRESS=http://ingress-nginx-controller.ingress-nginx.svc.cluster.local/health
              HOST=api.nextopus.local
              TOTAL=800

              echo "=== Rate Limit Test ==="
              echo "Sending $TOTAL concurrent requests through the nginx ingress."
              echo "The ingress allows 100 r/s with a burst of 200, so most of these"
              echo "should come back 429."
              echo ""

              # Requests must be concurrent. Sent one at a time they never reach
              # 100 r/s, so the limiter is never tripped and the test looks green
              # when it has proved nothing.
              i=0
              while [ $i -lt $TOTAL ]; do
                wget -q -O /dev/null -S --header="Host: $HOST" "$INGRESS" 2>>/tmp/out &
                i=$((i + 1))
              done
              wait

              SUCCESS=$(grep -c "HTTP/1.1 200" /tmp/out 2>/dev/null || echo 0)
              RATE_LIMITED=$(grep -c "HTTP/1.1 429" /tmp/out 2>/dev/null || echo 0)

              echo "=== Results ==="
              echo "Successful (200): $SUCCESS"
              echo "Rate Limited (429): $RATE_LIMITED"
              echo ""

              if [ "$RATE_LIMITED" -gt 0 ]; then
                echo "Rate limiting is WORKING"
              else
                echo "Rate limiting did NOT trigger"
                exit 1
              fi
          # add-default-securitycontext injects readOnlyRootFilesystem, so the
          # script needs a writable scratch mount.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Never
  backoffLimit: 1
---
# Prometheus alert for rate limiting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: nginx-rate-limit-alerts
  namespace: observability
  labels:
    prometheus: kube-prometheus
spec:
  groups:
    - name: nginx.ratelimit
      interval: 30s
      rules:
        - alert: HighRateLimitHits
          expr: |
            sum(rate(nginx_ingress_controller_requests{status="429"}[5m])) > 10
          for: 2m
          labels:
            severity: warning
            service: nginx-ingress
          annotations:
            summary: "High rate of 429 responses"
            description: "More than 10 requests/sec are being rate limited"

        - alert: ServiceOverloaded
          expr: |
            sum(rate(nginx_ingress_controller_requests{status="503"}[5m])) > 5
          for: 1m
          labels:
            severity: critical
            service: nginx-ingress
          annotations:
            summary: "Service returning 503 errors"
            description: "Backend service may be overloaded"
