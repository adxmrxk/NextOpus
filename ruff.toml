# Lint contract for the NextOpus Python services.
#
# Without an explicit `select`, `ruff check` follows whatever the installed
# ruff release happens to default to, so a new ruff turns CI red without a
# code change. These are ruff's classic defaults: pyflakes plus the pycodestyle
# error subset.
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]
